name: Lint supported API

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install ruff
      - name: Lint supported release surface
        run: >-
          python -m ruff check
          abi/__init__.py abi/__main__.py
          abi/capability_pipeline.py abi/capability_segregation.py
          abi/layercake_acquisition.py
          tests/test_public_release.py
          tests/test_capability_pipeline.py
          tests/test_capability_segregation.py
          examples/segregate_capabilities.py
