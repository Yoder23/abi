name: Verify supported release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: python -m pip install pytest build
      - run: python -m pip install -e ".[host]"
      - name: Install pinned research-test dependencies
        run: python -m pip install "transformers==4.57.3" "numpy==2.2.6"
      - run: python -m abi status --json
      - run: python -m abi self-check
      - name: Check documentation discovery and local links
        run: python scripts/check_docs.py
      - name: Test supported compiler surface
        run: >-
          python -m pytest -q
          tests/test_public_release.py
          tests/test_capability_pipeline.py
          tests/test_capability_segregation.py
          tests/test_plan_english_r98_completion.py
          tests/test_grounded_english_r99.py
          tests/test_r99_fit_audit.py
          tests/test_acquisition_capacity_r100.py
          tests/test_execution_continuation_r101.py
          tests/test_coverage_exposure_r102.py
          tests/test_r102_error_audit.py
          tests/test_r102_public_review.py
          tests/test_recipient_interface_r103.py
          tests/test_evaluator_control_r104.py
          tests/test_evaluator_scope_r105.py
      - run: python -m build
