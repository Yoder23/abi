[project]
name = "abi-layercake"
version = "0.2.0"
description = "Measured teacher capability extraction and segregated packaging for LayerCake"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Sam Yoder" }
]
keywords = [
  "large-language-models",
  "domain-adaptation",
  "knowledge-transfer",
  "capability-segregation",
  "frozen-modules",
  "transformers",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1",
  "transformers>=4.38",
  "sentencepiece>=0.1.99",
  "numpy",
  "tqdm",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff",
]

[project.urls]
Repository = "https://github.com/Yoder23/abi"

[project.scripts]
abi-moonshot = "abi.moonshot:main"
abi-layercake-release = "abi.moonshot_release:main"
abi-layercake-host-v3 = "abi.layercake_host_v3:main"
abi-layercake-domains-v3 = "abi.layercake_domains_v3:main"
abi-layercake-full-core-acquire = "abi.layercake_full_core_acquisition:main"
abi-layercake-generalization = "abi.english_generalization_evaluation:main"
abi-layercake-six-block-base = "abi.layercake_six_block_base:main"
abi-natural-english-catalog = "abi.natural_english_catalog:main"
abi-capability-compiler-phase0 = "abi.capability_compiler_phase0:main"
abi-capability-compiler-phase0-certificate = "abi.capability_compiler_phase0_certificate:main"
abi-research-artifact-manifest = "abi.research_artifact_manifest:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
include = ["abi*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
