[project]
name = "abi-capability-compiler"
version = "0.4.0a1"
description = "Provenance-preserving capability acquisition and segregation for external model hosts"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Sam Yoder" }
]
keywords = [
  "large-language-models",
  "domain-adaptation",
  "knowledge-transfer",
  "capability-segregation",
  "frozen-modules",
  "transformers",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
host = [
  "torch>=2.1",
  "psutil>=5.9",
  "safetensors>=0.4",
]
extraction = [
  "torch>=2.1",
  "transformers>=4.38",
  "sentencepiece>=0.1.99",
  "numpy",
  "tqdm",
  "regex",
  "datasets>=2.18.0",
  "pyyaml>=6.0",
  "huggingface_hub>=0.22.0",
]
human = [
  "cryptography>=41",
]
dev = [
  "build",
  "pytest>=7",
  "ruff",
]

[project.urls]
Repository = "https://github.com/Yoder23/abi"

[project.scripts]
abi = "abi.__main__:main"
abi-reproduce = "abi.reproduce:main"
abi-v2-verify = "abi_v2.verify_release:main"
abi-v2-verify-bundle = "abi_v2.verify_external_bundle:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["abi*"]

[tool.setuptools.package-data]
abi_v2 = [
  "*.json",
  "reference_vectors/*.json",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = [
  "test_public_release.py",
  "test_capability_pipeline.py",
  "test_capability_segregation.py",
  "test_abi_v2_*.py",
]
